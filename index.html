
<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimenzije Fleksibile</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Dimenzije Fleksibile</h1>

    <div class="input-section">

        <div class="input-row">
            <label for="totalLength">Ukupna dužina (mm)</label>
            <input type="number" id="totalLength" value="1100" min="0" max="10000" step="0.01">
        </div>

        <div class="input-row">
            <label for="radius">Radijus (mm)</label>
            <input type="number" id="radius" value="160" min="0" max="10000" step="0.01">
        </div>

        <div class="input-row">
            <label for="singleDimension">Osnovna dimenzija (mm)</label>
            <input type="number" id="singleDimension" value="500" min="0" max="10000" step="0.01">
        </div>

        <div class="input-row">
            <label for="od">Vanjski promjer (mm)</label>
            <input type="number" id="od" value="33.4" min="0" max="10000" step="0.01">
        </div>

        <button onclick="calculate()">Izračunaj</button>

    </div>


    <!-- TECHNICAL DRAWING -->

    <div class="diagram">

        <svg viewBox="0 0 680 550" xmlns="http://www.w3.org/2000/svg">

            <defs>
                <marker id="arrow"
                        markerWidth="10"
                        markerHeight="10"
                        refX="10"
                        refY="5"
                        orient="auto-start-reverse"
                        markerUnits="userSpaceOnUse">
                    <path d="M0,0 L10,5 L0,10 Z" fill="black"/>
                </marker>
            </defs>


            <!-- REFERENCE LINE -->

            <line x1="100" y1="179" x2="611" y2="179"
                  stroke="black" stroke-width="0.7"/>


            <!-- FLEXIBLE HOSE -->

            <path d="M261 525
                     L261 309
                     A147 147 0 0 1 408 179
                     L611 179"
                  fill="none"
                  stroke="red"
                  stroke-width="3"/>


            <!-- DIMENSION B -->

            <line x1="261" y1="45" x2="611" y2="45"
                  stroke="black" stroke-width="1"
                  marker-start="url(#arrow)"
                  marker-end="url(#arrow)"/>

            <line x1="261" y1="45" x2="261" y2="309"
                  stroke="black" stroke-width="0.7"/>

            <line x1="611" y1="45" x2="611" y2="179"
                  stroke="black" stroke-width="0.7"/>

            <rect x="415" y="18" width="45" height="25" fill="white"/>

            <text id="drawB" x="437" y="36"
                  text-anchor="middle" font-size="15">500 mm</text>


            <!-- DIMENSION D -->

            <line x1="408" y1="117" x2="611" y2="117"
                  stroke="black" stroke-width="1"
                  marker-start="url(#arrow)"
                  marker-end="url(#arrow)"/>

            <line x1="408" y1="117" x2="408" y2="179"
                  stroke="black" stroke-width="0.7"/>

            <rect x="490" y="90" width="45" height="25" fill="white"/>

            <text id="drawD" x="512" y="108"
                  text-anchor="middle" font-size="15">300 mm</text>


            <!-- DIMENSION A -->

            <line x1="100" y1="179" x2="100" y2="525"
                  stroke="black" stroke-width="1"
                  marker-start="url(#arrow)"
                  marker-end="url(#arrow)"/>

            <line x1="100" y1="179" x2="261" y2="179"
                  stroke="black" stroke-width="0.7"/>

            <line x1="100" y1="525" x2="261" y2="525"
                  stroke="black" stroke-width="0.7"/>

            <rect x="78" y="330" width="45" height="25" fill="white"/>

            <text id="drawA" x="100" y="348"
                  text-anchor="middle" font-size="15">500 mm</text>


            <!-- DIMENSION C -->

            <line x1="193" y1="309" x2="193" y2="525"
                  stroke="black" stroke-width="1"
                  marker-start="url(#arrow)"
                  marker-end="url(#arrow)"/>

            <line x1="193" y1="309" x2="261" y2="309"
                  stroke="black" stroke-width="0.7"/>

            <rect x="171" y="400" width="45" height="25" fill="white"/>

            <text id="drawC" x="193" y="418"
                  text-anchor="middle" font-size="15">340 mm</text>


            <!-- RADIUS LINE -->

            <line x1="358" y1="265" x2="308" y2="219"
                  stroke="black" stroke-width="1"
                  marker-end="url(#arrow)"/>


            <!-- RADIUS LABELS -->

            <rect x="365" y="252" width="145" height="22" fill="white"/>

            <text id="drawR" x="370" y="268" font-size="14">
                R 160 mm
            </text>

            <rect x="365" y="277" width="145" height="22" fill="white"/>

            <text id="drawRin" x="370" y="293" font-size="14">
                R inside 143.3 mm
            </text>

            <rect x="365" y="302" width="155" height="22" fill="white"/>

            <text id="drawRout" x="370" y="318" font-size="14">
                R outside 176.7 mm
            </text>

        </svg>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
